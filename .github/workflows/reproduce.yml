name: Reproduce

# Recomputes every summary from the committed model outputs and fails if any file in results/ changes.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run reproduce
      - name: Summaries match the committed ones
        run: git diff --exit-code --stat -- results/
